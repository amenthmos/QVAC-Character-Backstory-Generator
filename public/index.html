<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Character Backstory Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #f5f0ff 0%, #e6daff 100%);
    font-family: system-ui, sans-serif;
    color: #3b2a5e;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 540px; text-align: center; }
  .icon { font-size: 2rem; margin-bottom: 4px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #6a3fc4; font-weight: 800; }
  .subtitle { color: #6c5b96; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: #faf7ff;
    border: 2px solid #d3c0f5;
    border-radius: 20px;
    padding: 30px 26px;
    text-align: left;
  }
  label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: #5a3f96; }
  textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #d3c0f5;
    background: #fff;
    color: #3b2a5e;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 16px;
    resize: vertical;
  }
  button.action {
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #6a3fc4;
    color: #fff;
    box-shadow: 0 5px 0 #492a8f;
    width: 100%;
  }
  button.action:active { transform: translateY(3px); box-shadow: 0 2px 0 #492a8f; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #6c5b96; min-height: 1.2em; text-align: center; }
  .result-body { font-size: 1.02rem; line-height: 1.65; margin: 20px 0 4px; color: #3b2a5e; background: #f0e8ff; border-radius: 14px; padding: 16px; }
  .footer-note { color: #6c5b96; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #d3c0f5;
    border-top-color: #6a3fc4;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📖</div>
    <h1>QVAC Character Backstory Generator</h1>
    <p class="subtitle">Describe a character's traits or role, get a grounded backstory. 100% on-device.</p>

    <div class="card">
      <label for="traitsInput">Character traits / role</label>
      <textarea id="traitsInput" rows="3" placeholder="e.g. grumpy retired detective, now runs a bakery"></textarea>

      <button class="action" id="generateBtn">Generate Backstory</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const traitsInput = document.getElementById('traitsInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const traits = traitsInput.value.trim();
      if (!traits) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Writing their story...';

      try {
        const res = await fetch('/api/backstory', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ traits }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<div class="result-body">${escapeHtml(data.backstory)}</div>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
